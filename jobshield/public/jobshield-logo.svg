<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="6" y1="3.5" x2="34" y2="36.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E90FF" />
      <stop offset="100%" stop-color="#1877D2" />
    </linearGradient>
    <linearGradient id="shieldStroke" x1="20" y1="3.5" x2="20" y2="36.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0.4" />
    </linearGradient>
    <filter id="docShadow" x="10" y="9" width="20" height="23" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0B2B5C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Protection Shield Base -->
  <path
    d="M20 3.5 C13 3.5 7.5 5.5 6 8.5 C6 21.5 12 31.5 20 36.5 C28 31.5 34 21.5 34 8.5 C32.5 5.5 27 3.5 20 3.5 Z"
    fill="url(#shieldGrad)"
    stroke="url(#shieldStroke)"
    stroke-width="1.2"
  />

  <!-- Job Document Card inside Shield -->
  <g filter="url(#docShadow)">
    <path
      d="M13 13.5 C13 12.12 14.12 11 15.5 11 H23.5 L27 14.5 V26 C27 27.1 26.1 28 25 28 H15 C13.9 28 13 27.1 13 26 V13.5 Z"
      fill="#FFFFFF"
    />
    <path
      d="M23.5 11 V14 C23.5 14.28 23.72 14.5 24 14.5 H27 Z"
      fill="#D8ECFF"
    />
  </g>

  <!-- Verification Checkmark inside the Job Document -->
  <path
    d="M16 19.5 L18.5 22 L24 16.5"
    stroke="#1E90FF"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Recruitment Details / Offer Lines -->
  <line x1="16" y1="24.5" x2="24" y2="24.5" stroke="#93C5FD" stroke-width="1.4" stroke-linecap="round" />
  <line x1="16" y1="26.5" x2="21" y2="26.5" stroke="#93C5FD" stroke-width="1.4" stroke-linecap="round" />
</svg>
